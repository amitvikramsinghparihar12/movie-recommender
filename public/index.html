<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Next Watch: movie recommendations</title>
  <meta name="description" content="Pick a movie you love and find similar ones, matched by genre, themes, cast, director and plot.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="nav">
    <div class="wrap nav-in">
      <a class="logo" href="#" data-home>NEXTWATCH</a>
      <nav class="nav-links">
        <a href="#" data-home>Home</a>
        <a href="#genres" data-genres>Genres</a>
      </nav>
      <div class="search" role="search">
        <label class="sr-only" for="movie-input">Search movies</label>
        <input id="movie-input" type="text" autocomplete="off" spellcheck="false"
               placeholder="Loading..." disabled
               role="combobox" aria-expanded="false" aria-controls="suggestions" aria-autocomplete="list">
        <ul id="suggestions" role="listbox" aria-label="Matching movies" hidden></ul>
      </div>
    </div>
  </header>

  <main id="view"></main>

  <footer class="wrap">
    <p>Matches use genres, keywords, top cast, director and plot, compared with TF-IDF and cosine similarity.</p>
    <p>This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
